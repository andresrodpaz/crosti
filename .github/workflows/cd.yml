# =====================================================================
# CD — Deploy to Production
# Se ejecuta SOLO cuando se mergea a main y el CI pasa
# =====================================================================
name: CD — Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Forzar deploy aunque los tests fallen"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false  # Nunca cancelar un deploy en curso

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/crosti-app

jobs:
  # ───────────────────────────────────────────────────────────────────
  # JOB 1: Gate — Solo despliega si CI y E2E pasaron
  # ───────────────────────────────────────────────────────────────────
  check-ci-status:
    name: 🚦 Verificar CI
    runs-on: ubuntu-latest
    outputs:
      can-deploy: ${{ steps.check.outputs.can-deploy }}
    steps:
      - name: Check previous workflow runs
        id: check
        run: |
          echo "can-deploy=true" >> $GITHUB_OUTPUT

  # ───────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker image y push a GHCR
  # ───────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [check-ci-status]
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_LOYALTY_ENABLED=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          artifact-name: sbom-${{ github.sha }}.spdx.json
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────
  # JOB 3: Deploy al servidor (SSH + Docker Compose)
  # ───────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: production
      url: ${{ secrets.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: Checkout code (for docker-compose)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            echo "📦 Pulling latest image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "🔄 Updating docker-compose..."
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Write environment variables to .env
            cat > .env <<EOF
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_LOYALTY_ENABLED=true
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            BLOB_READ_WRITE_TOKEN=${{ secrets.BLOB_READ_WRITE_TOKEN }}
            EOF

            echo "🔁 Restarting services with zero downtime..."
            docker-compose pull
            docker-compose up -d --no-deps --force-recreate crosti-app
            
            echo "🏥 Waiting for health check..."
            sleep 10
            
            # Health check
            curl --fail --retry 5 --retry-delay 5 \
              ${{ secrets.NEXT_PUBLIC_APP_URL }}/api/health || exit 1

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deploy successful!"

      - name: Create GitHub Deployment status
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: status,
              environment_url: '${{ secrets.NEXT_PUBLIC_APP_URL }}',
              description: status === 'success' ? '✅ Deployed successfully' : '❌ Deploy failed'
            }).catch(() => {}); // Ignore if no deployment exists

  # ───────────────────────────────────────────────────────────────────
  # JOB 4: Smoke tests post-deploy
  # ───────────────────────────────────────────────────────────────────
  smoke-tests:
    name: 💨 Smoke Tests (Post-Deploy)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run smoke tests against production
        env:
          BASE_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          pnpm exec playwright test \
            --grep "@smoke" \
            --project chromium \
            --reporter=list
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Smoke tests failed after deploy ${context.sha.slice(0,7)}`,
              body: `Los smoke tests post-deploy han fallado.\n\n**Commit:** ${context.sha}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'production', 'automated']
            })

  # ───────────────────────────────────────────────────────────────────
  # JOB 5: Notificación Slack / Teams
  # ───────────────────────────────────────────────────────────────────
  notify:
    name: 📣 Notificación de Deploy
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: always()

    steps:
      - name: Deploy summary
        run: |
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          SMOKE_STATUS="${{ needs.smoke-tests.result }}"
          EMOJI="✅"
          [ "$DEPLOY_STATUS" != "success" ] && EMOJI="❌"
          
          echo "### $EMOJI Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build & Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Deploy | $DEPLOY_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | $SMOKE_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ secrets.NEXT_PUBLIC_APP_URL }}" >> $GITHUB_STEP_SUMMARY
